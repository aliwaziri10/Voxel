name: Regenerate Book 2 Manuscript
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild full manuscript
        run: python3 scripts/regen_book2_manuscript.py
      - name: Commit and push
        run: |
          git config user.name "aliwaziri10"
          git config user.email "aliwaziri10.2@gmail.com"
          git add novels/kindling-line-book-2/kindling-line-book-2_full_manuscript.md
          if git diff --cached --quiet; then echo "nothing to commit"; else git commit -m "Book 2: regenerate full_manuscript.md from the 45 chapter files" && git push; fi
