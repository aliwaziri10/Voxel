name: Voxel Novel (one command)

# Manual trigger only. Actions tab -> "Voxel Novel (one command)" -> Run
# workflow. Fill in the series/book/brief, wait. With --checkpoint the beat
# map and every chapter are committed as soon as they are written, so a crash
# or timeout never loses finished chapters. Re-running the same inputs resumes.
#
# 2026-09-25: added the beat_map_only input (passes --beat-map-only, which
# plans and saves the beat map and stops before drafting any chapter) and
# changed the word range from 2500-4500 to the charter's 2300-2700.
#
# Inputs are passed through env: and referenced as shell variables
# ("$BRIEF" etc.), not spliced directly into the run: script via
# ${{ inputs.brief }}. A quote character inside an input would otherwise break
# the shell command. Do not revert to inline ${{ inputs.* }} substitution
# inside any run: step below.

on:
  workflow_dispatch:
    inputs:
      series:
        description: "Story-bible series slug, e.g. 'amity-falls'"
        required: true
        type: string
      book:
        description: "Book title, e.g. 'Amity Falls Book 4'"
        required: true
        type: string
      chapters:
        description: "Number of chapters to write"
        required: true
        type: string
      brief:
        description: "What this book is about (a few sentences)"
        required: true
        type: string
      beat_map_only:
        description: "Tick to plan and save the beat map only, and stop before drafting chapters"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Set git identity
        run: |
          git config user.name "voxel-bot"
          git config user.email "actions@github.com"

      - name: Run voxel_cli.py novel
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
          OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
          OPENROUTER_API_KEY_4: ${{ secrets.OPENROUTER_API_KEY_4 }}
          OPENROUTER_API_KEY_5: ${{ secrets.OPENROUTER_API_KEY_5 }}
          OPENROUTER_API_KEY_6: ${{ secrets.OPENROUTER_API_KEY_6 }}
          SERIES: ${{ inputs.series }}
          BOOK: ${{ inputs.book }}
          CHAPTERS: ${{ inputs.chapters }}
          BRIEF: ${{ inputs.brief }}
          BEAT_MAP_ONLY: ${{ inputs.beat_map_only }}
        run: |
          EXTRA=""
          if [ "$BEAT_MAP_ONLY" = "true" ]; then
            EXTRA="--beat-map-only"
          fi
          python -u voxel_cli.py novel \
            --series "$SERIES" \
            --book "$BOOK" \
            --chapters "$CHAPTERS" \
            --brief "$BRIEF" \
            --min-words 2300 \
            --max-words 2700 \
            --checkpoint \
            $EXTRA

      - name: Log this run
        if: always()
        continue-on-error: true
        run: python push_logger.py

      - name: Commit chapters and story bible
        if: always()
        env:
          BOOK: ${{ inputs.book }}
          CHAPTERS: ${{ inputs.chapters }}
        run: |
          git add novels/ story_bibles/ CHANGELOG.md
          git diff --cached --quiet || git commit -m "Add $BOOK ($CHAPTERS chapters, auto-generated)"
          git pull --rebase
          git push
