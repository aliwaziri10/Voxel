name: Scan novel for tells

on:
  workflow_dispatch:
    inputs:
      book_dir:
        description: "Book folder"
        default: "novels/kindling-line-book-2"
        required: true

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run scanner
        run: python tools/scan_tells.py "${{ inputs.book_dir }}"
      - name: Commit report
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add "${{ inputs.book_dir }}/TELL_REPORT.md"
          git commit -m "Tell report for ${{ inputs.book_dir }}" || echo "No changes"
          git push
