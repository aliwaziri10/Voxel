name: Write Kindling Book 3

# Manual only. Actions tab -> "Write Kindling Book 3" -> Run workflow.
# Enter the FIRST chapter. The run writes that chapter and the next four
# (5 chapters per run, capped at chapter 45), in strict order, using
# scripts/write_kindling.py (canon lock, beat maps, romance scenes and the
# real text of the previous chapter). Each chapter is committed as soon as it
# is written. Existing chapters are kept unless "force" is ticked.
# Do not commit to the repo while this is running.

on:
  workflow_dispatch:
    inputs:
      start:
        description: "First chapter of this batch of 5 (1, 6, 11, 16 ... 41)"
        required: true
        type: string
        default: "1"
      force:
        description: "Tick to overwrite chapters that already exist"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Tick to only build and print the prompts (no model call, nothing saved)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: write-kindling
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Set git identity
        run: |
          git config user.name "aliwaziri10"
          git config user.email "aliwaziri10.2@gmail.com"

      - name: Write 5 chapters
        env:
          START: ${{ inputs.start }}
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
          OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
          OPENROUTER_API_KEY_4: ${{ secrets.OPENROUTER_API_KEY_4 }}
          OPENROUTER_API_KEY_5: ${{ secrets.OPENROUTER_API_KEY_5 }}
          OPENROUTER_API_KEY_6: ${{ secrets.OPENROUTER_API_KEY_6 }}
        run: |
          case "$START" in
            ''|*[!0-9]*) echo "ERROR: start must be a number from 1 to 45"; exit 1;;
          esac
          if [ "$START" -lt 1 ] || [ "$START" -gt 45 ]; then
            echo "ERROR: start must be from 1 to 45"; exit 1
          fi
          END=$((START + 4))
          if [ "$END" -gt 45 ]; then END=45; fi
          echo "Writing chapters $START to $END"
          EXTRA=""
          if [ "$FORCE" = "true" ]; then EXTRA="$EXTRA --force"; fi
          if [ "$DRY_RUN" = "true" ]; then EXTRA="$EXTRA --dry-run"; fi
          python -u scripts/write_kindling.py \
            --start "$START" \
            --end "$END" \
            --checkpoint \
            $EXTRA
