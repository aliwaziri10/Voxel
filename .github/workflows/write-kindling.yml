name: Write Kindling Book 3

# Manual only. Actions tab -> "Write Kindling Book 3" -> Run workflow.
# Enter the FIRST chapter and the LAST chapter. The run writes every chapter
# from first to last, in strict order, using scripts/write_kindling.py
# (canon lock, beat maps, romance scenes and the real text of the previous
# chapter). Each chapter is committed as soon as it is written. Existing
# chapters are kept unless "force" is ticked.
# GitHub allows 6 hours per run, about 20 chapters. The run stops itself
# cleanly at 5 hours 35 minutes; run it again from the next missing chapter.
# Do not commit to the repo while this is running.

on:
  workflow_dispatch:
    inputs:
      start:
        description: "First chapter to write (the first missing one)"
        required: true
        type: string
        default: "9"
      end:
        description: "Last chapter to write (45 = the end of the book)"
        required: true
        type: string
        default: "45"
      force:
        description: "Tick to overwrite chapters that already exist"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Tick to only build and print the prompts (no model call, nothing saved)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: write-kindling
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Set git identity
        run: |
          git config user.name "aliwaziri10"
          git config user.email "aliwaziri10.2@gmail.com"

      - name: Write chapters
        env:
          START: ${{ inputs.start }}
          END_CH: ${{ inputs.end }}
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_API_KEY_2: ${{ secrets.OPENROUTER_API_KEY_2 }}
          OPENROUTER_API_KEY_3: ${{ secrets.OPENROUTER_API_KEY_3 }}
          OPENROUTER_API_KEY_4: ${{ secrets.OPENROUTER_API_KEY_4 }}
          OPENROUTER_API_KEY_5: ${{ secrets.OPENROUTER_API_KEY_5 }}
          OPENROUTER_API_KEY_6: ${{ secrets.OPENROUTER_API_KEY_6 }}
        run: |
          case "$START" in
            ''|*[!0-9]*) echo "ERROR: start must be a number from 1 to 45"; exit 1;;
          esac
          case "$END_CH" in
            ''|*[!0-9]*) echo "ERROR: end must be a number from 1 to 45"; exit 1;;
          esac
          if [ "$START" -lt 1 ] || [ "$START" -gt 45 ]; then
            echo "ERROR: start must be from 1 to 45"; exit 1
          fi
          END="$END_CH"
          if [ "$END" -gt 45 ]; then END=45; fi
          if [ "$END" -lt "$START" ]; then
            echo "ERROR: end must not be lower than start"; exit 1
          fi
          echo "Writing chapters $START to $END"
          EXTRA=""
          if [ "$FORCE" = "true" ]; then EXTRA="$EXTRA --force"; fi
          if [ "$DRY_RUN" = "true" ]; then EXTRA="$EXTRA --dry-run"; fi
          set +e
          timeout 335m python -u scripts/write_kindling.py \
            --start "$START" \
            --end "$END" \
            --checkpoint \
            $EXTRA
          CODE=$?
          set -e
          if [ "$CODE" -eq 124 ]; then
            echo ""
            echo "TIME LIMIT REACHED. Every finished chapter is saved. Run this workflow again, starting at the first missing chapter."
            exit 0
          fi
          exit $CODE
