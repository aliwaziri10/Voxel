name: Proofread Novel Chapters

on:
  workflow_dispatch:
    inputs:
      book:
        description: "Which book to proofread"
        required: true
        default: "amity-falls-book-3"
        type: choice
        options:
          - amity-falls-book-3
          - amity-falls-book-2
          - all-unpublished
      word_min:
        description: "Minimum words per chapter"
        required: false
        default: "2300"
        type: string
      word_max:
        description: "Maximum words per chapter"
        required: false
        default: "2500"
        type: string
      commit_report:
        description: "Commit the report back to the repo"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  proofread:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run proofreading checks
        env:
          BOOK: ${{ inputs.book }}
          WORD_MIN: ${{ inputs.word_min }}
          WORD_MAX: ${{ inputs.word_max }}
        run: python scripts/proofread_novel.py

      - name: Commit report
        if: ${{ inputs.commit_report }}
        run: |
          git config user.name "voxel-proofreader-bot"
          git config user.email "actions@github.com"
          git add -A "novels/*/PROOFREAD_REPORT.md" "novels/*/HANDOFF.md"
          if ! git diff --cached --quiet; then
            git commit -m "Automated proofreading pass: ${{ inputs.book }}"
            git push
          else
            echo "No changes to commit."
          fi
