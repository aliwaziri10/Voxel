name: Proofread Novel Chapters

on:
  push:
    paths:
      - "novels/**/chapters/**.md"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  proofread:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run proofreading checks
        run: python scripts/proofread_novel.py

      - name: Commit report + HANDOFF update
        run: |
          git config user.name "voxel-proofreader-bot"
          git config user.email "actions@github.com"
          git add PROOFREAD_REPORT.md HANDOFF.md
          if ! git diff --cached --quiet; then
            git commit -m "Automated proofreading pass"
            git push
          else
            echo "No changes to commit."
          fi
