name: Proofread Novel Chapters

on:
  push:
    paths:
      - "novels/amity-falls-book-2/chapters/**.md"
      - "novels/amity-falls-book-3/chapters/**.md"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      book:
        description: "Which book to proofread"
        required: true
        default: "all-unpublished"
        type: choice
        options:
          - all-unpublished
          - amity-falls-book-3
          - amity-falls-book-2
      word_min:
        description: "Minimum words per chapter"
        required: false
        default: "1900"
        type: string
      word_max:
        description: "Maximum words per chapter"
        required: false
        default: "2500"
        type: string
      auto_fix:
        description: "Auto-fix dash/hyphen mechanics in chapter text (rewrites files if enabled)"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  proofread:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run proofreading checks (flag-only unless auto_fix is enabled)
        env:
          BOOK: ${{ inputs.book || 'all-unpublished' }}
          WORD_MIN: ${{ inputs.word_min || '1900' }}
          WORD_MAX: ${{ inputs.word_max || '2500' }}
          AUTO_FIX: ${{ (inputs.auto_fix && '1') || '0' }}
        run: python scripts/proofread_novel.py

      - name: Commit fixes and report
        run: |
          git config user.name "voxel-proofreader-bot"
          git config user.email "actions@github.com"
          git add -A "novels/*/chapters/*.md" "novels/*/PROOFREAD_REPORT.md" "novels/*/HANDOFF.md"
          if ! git diff --cached --quiet; then
            git commit -m "Automated proofread pass: fixes + report"
            git push
          else
            echo "No changes to commit."
          fi

      - name: Fail the run if any chapter has a hard violation
        run: |
          if grep -rl "_VIOLATION" novels/*/PROOFREAD_REPORT.md 2>/dev/null; then
            echo "::error::One or more chapters have hard violations (ai_tells, meta_leaks, duplicate sentences, or word-count floor). See PROOFREAD_REPORT.md above. The auto-fixes and report were still committed; this failure is a signal, not a rollback."
            exit 1
          fi
          echo "No hard violations found."
